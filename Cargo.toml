[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/ingest", "crates/api"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
dorman-core = { path = "crates/core" }
dorman-db = { path = "crates/db" }
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie-signed"] }
askama = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
