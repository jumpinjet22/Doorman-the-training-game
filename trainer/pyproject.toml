[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dorman-trainer"
version = "0.1.0"
description = "Nightly intent model for Who's At The Door?, trained from dorman-ingest export"
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.5", "joblib>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
dorman-trainer = "dorman_trainer.__main__:main"

[tool.setuptools.packages.find]
include = ["dorman_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
