name: 💡 Idea / feature request
description: Suggest a new feature or improvement for the game.
title: "[Idea]: "
labels: ["enhancement", "idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or frustration behind the idea.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the game to do? How would it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Gameplay / play page
        - API / server
        - Scoring
        - Ingest (KNOCK import/export)
        - Database
        - Docs
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to help build this?
      options:
        - Yes, I'd like to open a PR
        - Maybe, with some guidance
        - No, just suggesting
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar ideas.
          required: true
