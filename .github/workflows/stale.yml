name: stale

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 90
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,triage'
          exempt-pr-labels: 'pinned,security'
          exempt-draft-pr: true
          stale-issue-message: >
            This issue hasn't had any activity in 90 days, so it's been marked
            stale. It'll be closed in 30 days unless there's new activity --
            leave a comment if it's still relevant.
          stale-pr-message: >
            This pull request hasn't had any activity in 90 days, so it's been
            marked stale. It'll be closed in 30 days unless there's new activity.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if this is still an
            issue.
          close-issue-reason: not_planned
