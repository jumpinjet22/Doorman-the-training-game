name: lock-threads

on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          process-only: 'issues, prs'
          issue-inactive-days: 90
          pr-inactive-days: 90
          issue-comment: >
            This issue has been automatically locked since it was closed and
            has had no recent activity. Please open a new issue for related
            problems and link back to this one.
          pr-comment: >
            This pull request has been automatically locked since it was
            closed and has had no recent activity.
