name: codeql

# Advanced setup -- leave CodeQL "Default setup" off in repo settings, or the
# two configurations conflict and this workflow's uploads are rejected.
# Only scans the workflows for now; add the game's language to the matrix
# once there's source code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 5 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
